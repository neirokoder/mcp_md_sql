[project]
name = "md-sql-server"
version = "0.1.0"
description = "MCP server for working with Markdown documentation as a relational database"
requires-python = ">=3.11"
dependencies = [
    "mistune>=3.0",
    "watchdog>=6.0",
    "mcp>=1.0",
]

[project.scripts]
md-sql-server = "md_sql_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
