[project]
name = "mcp-md-sql"
version = "0.1.0"
description = "MCP server for working with Markdown documentation as a relational database"
requires-python = ">=3.11"
dependencies = [
    "mistune>=3.0",
    "watchdog>=6.0",
    "mcp>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-xdist>=3"]

[tool.pytest.ini_options]
addopts = "-n auto"

[tool.setuptools.packages.find]
where = ["src"]
